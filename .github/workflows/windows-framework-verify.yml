name: Windows .NET Framework verification

on:
  push:
    branches:
      - main
      - feature/office-foundation
    paths:
      - "src/**"
      - "tools/**"
      - "*.cmd"
      - "PowerPointLite.exe.config"
      - ".github/workflows/windows-framework-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PPLT_NO_PAUSE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Source compatibility audit
        shell: cmd
        run: RUN_SOURCE_AUDIT.cmd --quiet

      - name: Build with Windows .NET Framework csc
        shell: cmd
        run: BUILD_EXE.cmd --quiet

      - name: Run structural self-tests
        shell: cmd
        run: RUN_ALL_FORMAT_SELFTESTS.cmd

      - name: Upload verified portable build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PowerPointLite-windows-framework
          if-no-files-found: error
          retention-days: 14
          path: |
            PowerPointLite.exe
            PowerPointLite.exe.config
            TEST_WRITER_OUTPUT.pptx
            TEST_RICHTEXT_OUTPUT.pptx
            TEST_SVG_RENDER.png
            PPTX_FIDELITY_SELFTEST_OUTPUT/**
            ANIMATION_SELFTEST_OUTPUT/**
